<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频学习记忆库</title><link rel="stylesheet" href="memory.css"></head>
<body><header><div><p class="eyebrow">VIDEO NOTES</p><h1>我的视频记忆</h1><p>把看过的视频和聊过的问题，留在一起。</p></div><div class="actions"><button id="refresh">刷新记录</button><button id="export-all-md">全部下载 · Markdown</button><button id="export-all-json" class="primary">全部打包 · JSON</button></div></header>
<p class="privacy">保存在本机。打开某条记忆可接续该对话；新对话不会自动读取其他归档。下载包含完整问答与处理记录，不含 API Key 或识屏原图。</p>
<p id="notice" role="status"></p><div class="workspace"><aside><label for="filter">查找记忆</label><input id="filter" type="search" placeholder="视频标题、问题或回答…"><p id="stats"></p><nav id="records" aria-label="已保存对话"></nav></aside>
<main><section id="empty"><span>▤</span><h2>选择一段记忆</h2><p>视频总结和追问会自动保存到这里。</p></section><article id="detail" hidden><div class="detail-head"><div><p id="record-meta" class="eyebrow"></p><h2 id="record-title"></h2><a id="record-url" target="_blank" rel="noopener noreferrer">打开原视频 ↗</a></div><div class="actions"><button id="export-one-md">下载此条 · Markdown</button><button id="export-one-json">下载此条 · JSON</button></div></div><div id="record-body"></div></article></main></div><script type="module" src="memory.js"></script></body></html>
