<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知页 · 网页阅读</title>
<link rel="stylesheet" href="../../panel/panel.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="../../panel/typography.css">
<script src="../../panel/theme.js"></script>
<script src="../../panel/ui-prefs.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="M4 4.6c2.6-1 4.9-.8 7 .4v13.4c-1.9-1.2-4.2-1.4-7-.4V4.6Z" fill="currentColor" opacity=".92"/>
        <path d="M20 4.6c-2.6-1-4.9-.8-7 .4v13.4c1.9-1.2 4.2-1.4 7-.4V4.6Z" fill="currentColor" opacity=".55"/>
        <path d="M12 5.4v13" stroke="var(--brand-paper)" stroke-width="1.2" opacity=".5"/>
      </svg>
    </span>
    <span>知页<small id="site">打开一个网页开始</small></span>
  </div>
  <button id="settings" class="icon-btn" title="设置" aria-label="设置">⚙</button>
</header>
<main>
  <section id="page-card" class="card video-card page-card" aria-label="当前页面">
    <div id="p-mark" class="page-mark" aria-hidden="true">网</div>
    <div class="video-meta">
      <h1 id="p-title" class="v-title"></h1>
      <p id="p-sub" class="v-author"></p>
      <p id="p-stats" class="v-stats"></p>
      <div id="p-badges" class="badges"></div>
    </div>
  </section>
  <section class="toolbar">
    <button id="summarize" class="primary">读取并总结</button>
    <button id="stop" class="ghost" disabled>停止</button>
    <div id="style-seg" class="seg" role="group" aria-label="总结详细程度">
      <button type="button" data-style="brief">精简</button>
      <button type="button" data-style="standard" class="active">标准</button>
      <button type="button" data-style="detailed">精读</button>
    </div>
    <select id="mode" aria-label="联网模式">
      <option value="auto">自动联网</option>
      <option value="page">仅页面</option>
      <option value="web">强制联网</option>
    </select>
  </section>
  <div id="status" role="status">打开文字网页，点击「读取并总结」。</div>
  <div id="meta"></div>
  <div id="reader-actions" class="result-head reader-actions">
    <span class="result-label">本页对话</span>
    <span class="result-actions">
      <button id="btn-copy" class="ghost" type="button">复制</button>
      <button id="btn-export" class="ghost" type="button">导出 .md</button>
    </span>
  </div>
  <div id="conversation" aria-live="polite"></div>
</main>
<form id="ask">
  <textarea id="question" rows="2" placeholder="围绕当前页面提问…" aria-label="你的问题"></textarea>
  <button class="primary">提问</button>
</form>
<script type="module" src="panel.js"></script>
</body>
</html>
